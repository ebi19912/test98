# تنظیمات Nginx Reverse Proxy برای پلتفرم تست ۹۸ (test98.ir)
# مسیر قرارگیری در سرور: /etc/nginx/sites-available/test98.conf
# ایجاد سیم‌لینک: ln -s /etc/nginx/sites-available/test98.conf /etc/nginx/sites-enabled/

upstream test98_upstream {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name test98.ir www.test98.ir;

    # مسیر تایید هویت چالش‌های Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # انتقال خودکار ترافیک HTTP به HTTPS (پس از فعال‌سازی گواهی SSL)
    # return 301 https://$host$request_uri;

    # فشرده‌سازی خودکار Gzip برای افزایش سرعت لود صفحات
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    client_max_body_size 25M;

    location / {
        proxy_pass http://test98_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # بهینه‌سازی تایم‌اوت‌ها برای پردازش‌های خزش و آزمون
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # لاگ‌های اختصاصی سرور
    access_log /var/log/nginx/test98_access.log;
    error_log /var/log/nginx/test98_error.log;
}
