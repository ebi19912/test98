services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test98_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # نگهداری پایگاه داده SQLite در هاست جهت جلوگیری از پاک شدن داده‌ها با بازسازی کانتینر
      - ./test98.db:/app/test98.db
      - ./.env:/app/.env:ro
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
